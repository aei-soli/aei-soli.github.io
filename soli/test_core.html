<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SOLI Core JS — Engine Tests</title>
  <style>
    body { font-family: monospace; background: #0f1118; color: #d0c8b0; padding: 24px; }
    h1   { color: #c8a84a; }
    .ok  { color: #80c880; }
    .err { color: #e08080; }
    .section { margin-top: 20px; border-top: 1px solid #333; padding-top: 12px; }
    pre  { margin: 4px 0; font-size: 13px; }
  </style>
</head>
<body>
<h1>SOLI Core — JS Engine Test Suite</h1>
<div id="output"></div>

<script src="core/card.js"></script>
<script src="core/engine.js"></script>
<script src="core/solver.js"></script>
<script>
const out = document.getElementById("output");
let passed = 0, failed = 0;

function log(msg, ok) {
    const pre = document.createElement("pre");
    pre.className = ok === undefined ? "" : (ok ? "ok" : "err");
    pre.textContent = msg;
    out.appendChild(pre);
}

function section(title) {
    const d = document.createElement("div");
    d.className = "section";
    d.innerHTML = `<strong style="color:#c8a84a">${title}</strong>`;
    out.appendChild(d);
}

function assert(condition, label) {
    if (condition) { passed++; log(`  ✓ ${label}`, true); }
    else           { failed++;  log(`  ✗ ${label}`, false); }
}

// ── 1. Card basics ────────────────────────────────────────────
section("1. Card basics");
const c2H = new Card("H", 2);
const cKS = new Card("S", "K");
const cAD = new Card("D", "A");
assert(c2H.value() === 2,            "2H value = 2");
assert(cKS.value() === 13,           "KS value = 13");
assert(cAD.value() === 14,           "AD value = 14");
assert(c2H.toString() === "2H",      "2H toString");
assert(c2H.equals(new Card("H", 2)), "Card equality");
assert(!c2H.equals(cKS),             "Card inequality");
assert(createDeck().length === 52,   "Deck has 52 cards");

// ── 2. Deal ───────────────────────────────────────────────────
section("2. Deal");
const eng = new GameEngine();
let totalCards = 0;
for (let r = 0; r < 4; r++)
    for (let c = 0; c < 13; c++)
        if (eng.board[r][c]) totalCards++;
assert(totalCards === 48, "48 cards dealt (4 Aces removed)");
assert(eng.round === 1,   "Starts at round 1");
assert(eng.score === 0,   "Starts with score 0");
assert(eng.moves === 0,   "Starts with 0 moves");
assert(!eng.gameWon,      "Not won at start");
assert(!eng.gameOver,     "Not over at start");

// ── 3. Seeded deal (Daily Challenge) ─────────────────────────
section("3. Seeded deal (deterministic)");
const e1 = new GameEngine(12345);
const e2 = new GameEngine(12345);
let same = true;
for (let r = 0; r < 4; r++)
    for (let c = 0; c < 13; c++) {
        const a = e1.board[r][c], b = e2.board[r][c];
        if (a === null && b === null) continue;
        if (!a || !b || !a.equals(b)) { same = false; break; }
    }
assert(same, "Same seed produces same board");

const e3 = new GameEngine(99999);
let diff = false;
for (let r = 0; r < 4; r++)
    for (let c = 0; c < 13; c++) {
        const a = e1.board[r][c], b = e3.board[r][c];
        if ((a === null) !== (b === null)) { diff = true; break; }
        if (a && b && !a.equals(b))       { diff = true; break; }
    }
assert(diff, "Different seeds produce different boards");

// ── 4. Move validation ────────────────────────────────────────
section("4. Move validation");
// Build a controlled board for testing
const te = new GameEngine(0);
// Force a clean row for testing
te.board[0] = Array(13).fill(null);
te.board[0][0] = new Card("H", 2);
te.board[0][1] = new Card("H", 3);
// slot [0][2] is empty — 4H should be valid there
const c4H = new Card("H", 4);
const c4D = new Card("D", 4);
assert(te.validMove(c4H, 0, 2),  "4H valid after 3H");
assert(!te.validMove(c4D, 0, 2), "4D invalid after 3H (wrong suit)");
assert(!te.validMove(c4H, 0, 3), "4H invalid at col 3 (gap at col 2)");
// King blocker
te.board[1] = Array(13).fill(null);
te.board[1][0] = new Card("D", "K");
assert(!te.validMove(new Card("D", 2), 1, 1), "Nothing valid after K");

// ── 5. Apply move + scoring ───────────────────────────────────
section("5. Apply move + scoring");
const se = new GameEngine(42);
const firstMoves = se.allMoves();
assert(firstMoves.length > 0, "At least one move available at start");
if (firstMoves.length) {
    const [src, dst] = firstMoves[0];
    const scoreBefore  = se.score;
    const movedCard    = se.board[src[0]][src[1]];
    const completions  = se.applyMove(src, dst);
    assert(se.moves === 1, "Move count incremented to 1");
    assert(se.board[dst[0]][dst[1]] !== null, "Card placed at destination");
    assert(se.board[src[0]][src[1]] === null,  "Source slot emptied");
    assert(Array.isArray(completions),          "applyMove returns array");
    // Score either increases (move awarded points) or stays same (non-scoring move)
    assert(se.score >= scoreBefore, "Score does not decrease after a move");
}

// ── 6. Undo / Redo ────────────────────────────────────────────
section("6. Undo / Redo");
const ue = new GameEngine(42);
const moves0 = ue.allMoves();
if (moves0.length) {
    const board0 = JSON.stringify(ue.board.map(r => r.map(c => c ? c.toString() : null)));
    const score0 = ue.score;
    ue.applyMove(moves0[0][0], moves0[0][1]);
    const ok1 = ue.undo();
    assert(ok1, "Undo returns true");
    const board1 = JSON.stringify(ue.board.map(r => r.map(c => c ? c.toString() : null)));
    assert(board1 === board0, "Board restored after undo");
    assert(ue.score === score0, "Score restored after undo");
    const ok2 = ue.redo();
    assert(ok2, "Redo returns true");
    assert(ue.moves === 1, "Moves count correct after redo");
}

// ── 7. Next round ─────────────────────────────────────────────
section("7. Next round");
const re = new GameEngine(7);
const r1 = re.round;
re.nextRound();
assert(re.round === r1 + 1, "Round incremented");
assert(re.history.length === 0, "History cleared after round");
assert(re.future.length === 0,  "Future cleared after round");

// ── 8. Round 4 snapshot + replay ─────────────────────────────
section("8. Round 4 snapshot + replay");
const r4e = new GameEngine(99);
r4e.nextRound(); // → round 2
r4e.nextRound(); // → round 3
r4e.nextRound(); // → round 4
assert(r4e._round4Snapshot !== null, "Round 4 snapshot captured");
const snapStr = JSON.stringify(r4e._round4Snapshot.map(r => r.map(c => c ? c.toString() : null)));
// Make a move then replay
const m4 = r4e.allMoves();
if (m4.length) r4e.applyMove(m4[0][0], m4[0][1]);
r4e.replayRound4();
const afterReplay = JSON.stringify(r4e.board.map(r => r.map(c => c ? c.toString() : null)));
assert(afterReplay === snapStr, "Board restored to R4 start after replay");
assert(!r4e.gameOver, "gameOver cleared after replay");

// ── 9. nextRound returns false at MAX_ROUNDS ──────────────────
section("9. Game over when rounds exhausted");
const ge = new GameEngine(1);
ge.nextRound(); ge.nextRound(); ge.nextRound();
assert(ge.round === 4, "At round 4");
const result = ge.nextRound(); // no force
assert(result === false,  "nextRound returns false at MAX_ROUNDS");
assert(ge.gameOver,       "gameOver set");

// Force = lifeline round 5
const ge2 = new GameEngine(1);
ge2.nextRound(); ge2.nextRound(); ge2.nextRound();
const r5 = ge2.nextRound(true);
assert(r5 === true,  "nextRound(force=true) allows round 5");
assert(ge2.round === 5, "Round is 5");

// ── 10. Win detection ─────────────────────────────────────────
section("10. Win detection");
const we = new GameEngine(0);
// Manually build a winning board
we.board = [
    [new Card("H",2),new Card("H",3),new Card("H",4),new Card("H",5),
     new Card("H",6),new Card("H",7),new Card("H",8),new Card("H",9),
     new Card("H",10),new Card("H","J"),new Card("H","Q"),new Card("H","K"),null],
    [new Card("D",2),new Card("D",3),new Card("D",4),new Card("D",5),
     new Card("D",6),new Card("D",7),new Card("D",8),new Card("D",9),
     new Card("D",10),new Card("D","J"),new Card("D","Q"),new Card("D","K"),null],
    [new Card("C",2),new Card("C",3),new Card("C",4),new Card("C",5),
     new Card("C",6),new Card("C",7),new Card("C",8),new Card("C",9),
     new Card("C",10),new Card("C","J"),new Card("C","Q"),new Card("C","K"),null],
    [new Card("S",2),new Card("S",3),new Card("S",4),new Card("S",5),
     new Card("S",6),new Card("S",7),new Card("S",8),new Card("S",9),
     new Card("S",10),new Card("S","J"),new Card("S","Q"),new Card("S","K"),null],
];
we._checkWin();
assert(we.gameWon,        "Game won with complete board");
assert(we.winBonus > 0,   "Win bonus awarded");
assert(we.score > 0,      "Score positive after win");

// ── 11. Solver ────────────────────────────────────────────────
section("11. Solver");
const solEng = new GameEngine(55);
const solver  = new Solver(solEng);
const best = solver.bestMove();
assert(best !== null || solEng.isLocked, "bestMove returns a move (or locked)");
if (best) {
    const explanation = solver.explain(best);
    assert(typeof explanation === "string" && explanation.startsWith("Hint:"), "explain() returns hint string");
}

// ── 12. Sequence lengths ──────────────────────────────────────
section("12. Sequence lengths");
const sle = new GameEngine(0);
sle.board[0] = Array(13).fill(null);
sle.board[0][0] = new Card("H", 2);
sle.board[0][1] = new Card("H", 3);
sle.board[0][2] = new Card("H", 4);
const lens = sle.sequenceLengths();
assert(lens[0] === 3, "Row 0 sequence length = 3");

// ── Summary ───────────────────────────────────────────────────
section("Summary");
const total = passed + failed;
log(`${passed}/${total} tests passed${failed ? ` — ${failed} FAILED` : " — all green ✓"}`,
    failed === 0 ? true : false);
</script>
</body>
</html>
