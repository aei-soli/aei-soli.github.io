<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SOLI</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#1b5e3b">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* Body is padded by the iOS safe-area insets; the canvas fills the remaining
       content box at 100% × 100%. game.js reads canvas.clientWidth/clientHeight (the
       real drawable area, insets already excluded) — reliable in WKWebView, unlike a
       position:fixed canvas which sizes inconsistently. */
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #1b5e3b;
      padding: env(safe-area-inset-top)  env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    canvas#game {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }
    /* Ad banner — sits at the very bottom, above safe-area */
    #ad-strip {
      display: none;               /* hidden by default; shown for free users */
      position: fixed;
      bottom: 0;
      bottom: env(safe-area-inset-bottom, 0px);
      left: 0; right: 0;
      height: 90px;
      background: #111;
      text-align: center;
      z-index: 10;
      overflow: hidden;
    }
    #ad-strip ins.adsbygoogle {
      display: inline-block;
      width: 728px;
      height: 90px;
    }
    /* CarbonAds — neutralise their default fixed/absolute positioning so the ad
       sits centred inside our bottom strip instead of floating top-right. */
    #ad-strip #carbonads {
      position: static !important;
      display: inline-block;
      max-width: 360px;
      margin: 0 auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #ad-strip #carbonads * { box-sizing: content-box; }
    #ad-strip .carbon-img { float: left; margin-right: 10px; }
    #ad-strip .carbon-text,
    #ad-strip .carbon-poweredby {
      display: block; color: #ddd; text-decoration: none; font-size: 12px;
    }
    #ad-strip .carbon-poweredby { color: #999; font-size: 9px; text-transform: uppercase; }
  </style>
</head>
<body>
  <!-- On-screen error catcher (temporary diagnostic). Shows uncaught JS errors so a
       blank board reveals its cause instead of failing silently. Safe to remove later. -->
  <div id="err" style="position:fixed;top:0;left:0;right:0;z-index:9999;background:rgba(140,0,0,0.92);
       color:#fff;font:12px/1.4 -apple-system,system-ui,monospace;padding:8px;white-space:pre-wrap;
       display:none;max-height:50%;overflow:auto;"></div>
  <script>
    (function () {
      function show(msg) {
        var d = document.getElementById("err");
        if (!d) return;
        d.style.display = "block";
        d.textContent = (d.textContent ? d.textContent + "\n" : "") + msg;
      }
      window.addEventListener("error", function (e) {
        show("ERROR: " + (e.message || e.error) + (e.filename ? "  @ " + e.filename.split("/").pop() + ":" + e.lineno : ""));
      });
      window.addEventListener("unhandledrejection", function (e) {
        show("PROMISE: " + (e.reason && (e.reason.message || e.reason)));
      });
    })();
  </script>

  <canvas id="game"></canvas>

  <!--
    Hidden inputs that trigger the native iOS/iPadOS keyboard.
    Canvas elements cannot call keyboard; these invisible inputs do it instead.
    game.js calls .focus() on the right one when the user taps a text field.
  -->
  <input id="kb-name" type="text"
         autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false"
         style="position:fixed;opacity:0;pointer-events:none;left:50%;top:50%;width:1px;height:1px;border:none;outline:none;background:transparent;">
  <input id="kb-email" type="email"
         autocomplete="email" autocorrect="off" autocapitalize="none" spellcheck="false"
         style="position:fixed;opacity:0;pointer-events:none;left:50%;top:50%;width:1px;height:1px;border:none;outline:none;background:transparent;">

  <!--
    Ad banner — shown for free users, hidden for premium.
    Replace data-ad-client and data-ad-slot with your real AdSense values before deploy.
    The GameUI shows/hides this div based on _isPremium.
  -->
  <!--
    Web ad strip. Free desktop/web users only — hidden for premium and on Capacitor
    (iOS/Android use the native AdMob banner instead).

    PRIMARY: CarbonAds. ui/carbonads.js injects the Carbon script into #carbon-host
    once you've been approved and filled in your serve/placement IDs in that file.
    Until then carbonads.configured === false, so the strip stays hidden (no empty bar).

    FALLBACK (optional): Google AdSense. If you'd rather run AdSense on web, uncomment
    the block below and replace the slot ID. Don't run both at once.
  -->
  <div id="ad-strip">
    <div id="carbon-host"></div>
    <!--
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4986726877058608"
            crossorigin="anonymous"></script>
    <ins class="adsbygoogle"
         style="display:inline-block;width:728px;height:90px"
         data-ad-client="ca-pub-4986726877058608"
         data-ad-slot="8018588834"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    -->
  </div>

  <!--
    Capacitor bridge + AdMob plugin.
    capacitor.core.js augments (does not replace) the native window.Capacitor injected
    by the iOS WebView, and defines the capacitorExports global that admob.plugin.js needs.
    admob.plugin.js registers the AdMob plugin and exposes window.capacitorStripe.
    Both must load in every context — native and browser.
  -->
  <script src="capacitor.core.js"></script>
  <script src="admob.plugin.js"></script>

  <!-- Domain model (no UI) -->
  <script src="core/card.js"></script>
  <script src="core/engine.js"></script>
  <script src="core/solver.js"></script>
  <script src="core/stats.js"></script>
  <script src="core/firebase.js"></script>
  <script src="core/sound.js"></script>
  <script src="core/purchases.js"></script>

  <!-- UI layer -->
  <script src="ui/carbonads.js"></script>
  <script src="ui/ads.js"></script>
  <script src="ui/skins.js"></script>
  <script src="ui/renderer.js"></script>
  <script src="ui/input.js"></script>
  <script src="ui/game.js"></script>
  <script>
    // No service worker. A cache-first SW used to cause stale-asset mismatches after
    // deploys (old renderer.js + new skins.js → "PALETTE already declared"). Unregister
    // any previously-installed SW and clear its caches so returning visitors get fresh
    // files. (sw.js is now a self-destruct stub that also cleans up.)
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then((rs) => rs.forEach((r) => r.unregister()))
        .catch(() => {});
      if (window.caches && caches.keys) {
        caches.keys().then((keys) => keys.forEach((k) => caches.delete(k))).catch(() => {});
      }
    }
  </script>
</body>
</html>
